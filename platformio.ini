; SFGE — Sci-Fi Game Engine
; Multi-device prop-game firmware (ESP32-S3). All theming comes from the
; scenario JSON on each device's SD card.

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I src
lib_deps =
    lovyan03/LovyanGFX
    lvgl/lvgl@^8.3.11
    adafruit/Adafruit PN532
    Wire

; ── Datapad (player handheld) ──
[env:datapad]
build_src_filter = +<main.cpp>
build_flags =
    ${env.build_flags}
    -DSFGE_DEVICE_DATAPAD
lib_deps =
    ${env.lib_deps}
    bblanchon/ArduinoJson@^7

; ── Panel (headless wall node — no display) ──

[env:panel]
build_src_filter = +<panel.cpp>
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DSFGE_DEVICE_PANEL
lib_deps =
    adafruit/Adafruit PN532
    adafruit/Adafruit NeoPixel
    bblanchon/ArduinoJson@^7
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/me-no-dev/AsyncTCP.git
    Wire

; ── Panel #2 (same firmware; embedded test config provisions it as PANEL_02) ──
[env:panel2]
build_src_filter = +<panel.cpp>
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DSFGE_DEVICE_PANEL
    -DSFGE_PANEL2
lib_deps =
    adafruit/Adafruit PN532
    adafruit/Adafruit NeoPixel
    bblanchon/ArduinoJson@^7
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/me-no-dev/AsyncTCP.git
    Wire

; ── Droid (headless astromech prop — WiFi AP + buzzer, no display, no NFC) ──
; Hardware: SD on HSPI (CS=15, MOSI=16, CLK=17, MISO=18), buzzer on GPIO 4,
; optional eye LED on GPIO 5, RGB strip data on GPIO 21. Same dev board as the datapad.
[env:droid]
build_src_filter = +<droid.cpp>
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DSFGE_DEVICE_DROID
lib_deps =
    adafruit/Adafruit PN532
    adafruit/Adafruit NeoPixel
    madhephaestus/ESP32Servo@^3.0.5
    bblanchon/ArduinoJson@^7
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/me-no-dev/AsyncTCP.git
    Wire

; ── Terminal (headless NFC kiosk — same ESP32-S3, no display) ──
; Hardware: PN532 on I2C bus 1 (SDA=14, SCL=13), SD on HSPI (CS=15, MOSI=16,
; CLK=17, MISO=18), passive buzzer on GPIO 4. Acts as a WiFi AP for player
; datapads to connect, broadcasts card scans via mesh.
[env:terminal]
build_src_filter = +<terminal.cpp>
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DSFGE_DEVICE_TERMINAL
lib_deps =
    adafruit/Adafruit PN532
    adafruit/Adafruit NeoPixel
    bblanchon/ArduinoJson@^7
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/me-no-dev/AsyncTCP.git
    Wire

; ── Droid #2 (same firmware; embedded test config provisions C1-1U17K) ──
[env:droid2]
build_src_filter = +<droid.cpp>
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DSFGE_DEVICE_DROID
    -DSFGE_DROID2
lib_deps =
    adafruit/Adafruit PN532
    adafruit/Adafruit NeoPixel
    madhephaestus/ESP32Servo@^3.0.5
    bblanchon/ArduinoJson@^7
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/me-no-dev/AsyncTCP.git
    Wire

; ── Terminal #2 (same firmware; embedded test config provisions TERM_02) ──
[env:terminal2]
build_src_filter = +<terminal.cpp>
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DSFGE_DEVICE_TERMINAL
    -DSFGE_TERM2
lib_deps =
    adafruit/Adafruit PN532
    adafruit/Adafruit NeoPixel
    bblanchon/ArduinoJson@^7
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/me-no-dev/AsyncTCP.git
    Wire

; ── Guild Master (Waveshare ESP32-S3-DualEye-LCD-1.28) ──
; Bounty Hunter Guild prop: two round 240x240 GC9A01 eyes, ES8311 audio
; codec (I2S: MCLK=12 BCLK=13 WS=14 DOUT=15, I2C ctrl SDA=11 SCL=10),
; TF card on SDMMC 1-bit (CLK=17 CMD=21 D0=18). 16MB flash, 8MB PSRAM.
[env:guildmaster]
build_src_filter = +<guild.cpp>
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DSFGE_DEVICE_GUILD
lib_deps =
    lovyan03/LovyanGFX
    bblanchon/ArduinoJson@^7
    esphome/ESP32-audioI2S@^2.0.7
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/me-no-dev/AsyncTCP.git
    Wire

; ── Actor Tool (staff datapad — same hardware as the player datapad) ──
; Scan a player's operative card to award/deduct credits, hand over items,
; or fire story events. Config: /SFGE/actor.json
[env:actor]
build_src_filter = +<actor.cpp>
build_flags =
    ${env.build_flags}
    -DSFGE_DEVICE_ACTOR
lib_deps =
    ${env.lib_deps}
    bblanchon/ArduinoJson@^7

; ── Audio Node (sister S3 + DFPlayer Mini — plays voice lines for props
;    whose own audio is absent/broken; commanded over the mesh) ──
; Standalone board settings: this is often a bare/cheap S3 module, so no
; OPI-PSRAM or 16MB-flash assumptions — DIO flash, 4MB, default partitions
; boot on any ESP32-S3.
[env:audionode]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_upload.flash_size = 4MB
board_build.partitions = default.csv
board_build.arduino.memory_type = dio_qspi
monitor_speed = 115200
build_src_filter = +<audionode.cpp>
; This board's COM port is the S3's native USB-Serial-JTAG, so Serial must
; go to USB CDC to be visible (rst reason 0x15 on reset confirmed this).
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    dfrobot/DFRobotDFPlayerMini@^1.0.6
lib_ignore = lvgl, LovyanGFX

; ── Servo Node (ESP32-S3 Super Mini — remote head servo; currently a
;    standalone exerciser, destined to take ESP-NOW commands from a droid) ──
; Clone-safe board settings like the audio node: DIO flash, 4MB, no PSRAM
; assumptions, serial over native USB.
[env:servonode]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_upload.flash_size = 4MB
board_build.partitions = default.csv
board_build.arduino.memory_type = dio_qspi
monitor_speed = 115200
build_src_filter = +<servonode.cpp>
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    madhephaestus/ESP32Servo@^3.0.5
lib_ignore = lvgl, LovyanGFX

; ── Panel test (minimal WiFi only) ──
[env:panel_test]
build_src_filter = +<panel_test.cpp>
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
lib_ignore = lvgl, LovyanGFX

; ── GM Datapad (Elecrow CrowPanel ESP32-S3 7" 800x480 — Game Master) ──
; Board: ESP32-S3-WROOM-1 N4R8 (4MB flash, 8MB PSRAM)
; Display: 7" 800x480 parallel RGB (EK9716+EK73002), GT911 touch, microSD slot
[env:gm_datapad]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_upload.flash_size = 4MB
; min_spiffs has two OTA app slots (huge_app has none) — needed for
; firmware-from-SD updates
board_build.partitions = min_spiffs.csv
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
build_src_filter = +<gm.cpp>
build_flags =
    -DBOARD_HAS_PSRAM
    ; COM port is the S3's native USB-Serial-JTAG — route Serial there so
    ; [NFC]/debug printf output is actually visible
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DSFGE_DEVICE_GM
    -I src
lib_deps =
    lovyan03/LovyanGFX
    lvgl/lvgl@^8.3.11
    adafruit/Adafruit PN532
    bblanchon/ArduinoJson@^7
    Wire
