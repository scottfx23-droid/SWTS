; SWTS — Star Wars: Twin Suns
; Multi-device firmware (same ESP32-S3 hardware)

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I src
lib_deps =
    lovyan03/LovyanGFX
    lvgl/lvgl@^8.3.11
    adafruit/Adafruit PN532
    Wire

; ── Datapad (player handheld) ──
[env:datapad]
build_src_filter = +<main.cpp>
build_flags =
    ${env.build_flags}
    -DSWTS_DEVICE_DATAPAD
lib_deps =
    ${env.lib_deps}
    bblanchon/ArduinoJson@^7

; ── Panel (headless wall node — no display) ──

[env:panel]
build_src_filter = +<panel.cpp>
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DSWTS_DEVICE_PANEL
lib_deps =
    adafruit/Adafruit PN532
    bblanchon/ArduinoJson@^7
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/me-no-dev/AsyncTCP.git
    Wire

; ── Droid (headless astromech prop — WiFi AP + buzzer, no display, no NFC) ──
; Hardware: SD on HSPI (CS=15, MOSI=16, CLK=17, MISO=18), buzzer on GPIO 4,
; optional eye LED on GPIO 5. Same dev board as the datapad.
[env:droid]
build_src_filter = +<droid.cpp>
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DSWTS_DEVICE_DROID
lib_deps =
    bblanchon/ArduinoJson@^7
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/me-no-dev/AsyncTCP.git
    Wire

; ── Terminal (headless NFC kiosk — same ESP32-S3, no display) ──
; Hardware: PN532 on I2C bus 1 (SDA=14, SCL=13), SD on HSPI (CS=15, MOSI=16,
; CLK=17, MISO=18), passive buzzer on GPIO 4. Acts as a WiFi AP for player
; datapads to connect, broadcasts card scans via mesh.
[env:terminal]
build_src_filter = +<terminal.cpp>
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DSWTS_DEVICE_TERMINAL
lib_deps =
    adafruit/Adafruit PN532
    bblanchon/ArduinoJson@^7
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/me-no-dev/AsyncTCP.git
    Wire

; ── Panel test (minimal WiFi only) ──
[env:panel_test]
build_src_filter = +<panel_test.cpp>
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
lib_ignore = lvgl, LovyanGFX

; ── GM Datapad (Elecrow CrowPanel ESP32-S3 7" 800x480 — Game Master) ──
; Board: ESP32-S3-WROOM-1 N4R8 (4MB flash, 8MB PSRAM)
; Display: 7" 800x480 parallel RGB (EK9716+EK73002), GT911 touch, microSD slot
[env:gm_datapad]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_upload.flash_size = 4MB
board_build.partitions = huge_app.csv
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
build_src_filter = +<gm.cpp>
build_flags =
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -DSWTS_DEVICE_GM
    -I src
lib_deps =
    lovyan03/LovyanGFX
    lvgl/lvgl@^8.3.11
    bblanchon/ArduinoJson@^7
